<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>技术资料中心</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="技术资料学习平台，包含软件、技术、示例、知识等PDF资料">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '技术资料中心', // 网页标题，可修改成你的公司名+技术资料中心
      repo: '', // 留空，不用改
      loadSidebar: true, // 显示左侧菜单，必须开启
      subMaxLevel: 3, // 菜单层级，不用改
      search: 'auto', // 全局搜索功能，自动生效
      themeColor: '#1677ff', // 主题色，可修改（比如#000000是黑色，#ff0000是红色）
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pdf-embed/dist/docsify-pdf-embed.min.js"></script>
</body>
</html>
